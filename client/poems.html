<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>መሶብ</title>
</head>
<body>
    <header>
            <h1>ግጥም ሲጥም</h1>
            <nav id="navbar"></nav>
        </header>
        <div class="mesob">
            <div class="Mesob-header">
                <h2 class="section-intro">እነሆ የግጥም ቡፌ</h2>
                
            </div>
            
            <div class="mesob-content">

                <section class="profile-section">
                    <h3>ጓደኛ ለመፈለግ</h3>
                    <form class="search-form" id="userSearchForm">
                        <input type="text" id="userSearchInput" placeholder="በስም ይፈልጉ..." required>
                        <button type="submit" class="auth-btn">ፈልግ</button>
                    </form>
                    <div class="user-results" id="userSearchResults"></div>
                </section>

                <div class="mesob-filter">
                    <button class="filter-btn active" data-filter="main">ተወዳጅ ግጥሞች</button>
                    <button class="filter-btn" data-filter="submitted">ከናንት ለኛ</button>
                </div>
                
                <div class="poem-actions">

                    <button id="newPoemBtn" class="auth-btn">

                         + ግጥም ለመፃፍ

                   </button>

                </div>

                <div class="mesob-poem" id="mesob-poem">
                    <!-- Poems will be loaded here -->
                </div>
            </div>
        </div>

<div id="poemModal" class="modal hidden">

    <div class="modal-content">

        <h2 id="modalTitle">
            ግጥም ይፃፉ
        </h2>

        <form id="poemForm">

            <input
                type="hidden"
                id="poemId">

            <div class="form-group">

                <label>ርዕስ</label>

                <input
                    id="poemTitle"
                    type="text"
                    required>

            </div>

            <div class="form-group">

                <label>ግጥም</label>

                <textarea
                    id="poemContent"
                    rows="10"
                    required></textarea>

            </div>

            <div class="modal-buttons">

                <button
                    type="button"
                    id="cancelModal">

                    ሰርዝ

                </button>

                <button
                    class="auth-btn"
                    type="submit">

                    አጋራው

                </button>

            </div>

        </form>

    </div>

</div>


        <footer id="footer">
        <div class="content">
            <div class="footer-links">
                <div class="links">
                    <div class="footer-title">ክፍሎች</div>
                    <nav>
                        <a href="home.html">ቤት-ለእንግዳ</a>
                        <a href="poems.html">መሶብ</a>
                        
                    </nav>
                </div>
                <div class="links">
                    <div class="footer-title">ማህበራዊ ሚድያ</div>
                    <nav>
                       <a href="#">ፌስቡክ</a>
                       <a href="#">ኢንስታግራም</a>
                       <a href="#">ቲክቶክ</a>
                       <a href="#">ቴሌግራም</a>
                    </nav>
                </div>
            </div>
            <div class="footer-bottom">
                &copy; 2018 ግጥም ሲጥም. All rights reserved.
            </div>
        </div>
    </footer>
    <script src="js/storage.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="components/navbar.js"></script>
<script src="js/poems.js"></script>

</body>
</html>
